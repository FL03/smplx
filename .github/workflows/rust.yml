name: rust

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CRATE_BASENAME: ${{ github.event.repository.name }}

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ v*.*.* ]
  release:
    types: [ created ]
  repository_dispatch:
    types: [ rust ]
  schedule:
    - cron: "30 21 * * 0" # Every Sunday at 9:30pm UTC
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
        toolchain: [ stable ]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - 
        name: setup blas
        run: |
          if [ ${{ matrix.platform }} == 'macos-latest' ]; then
            brew install openblas
          elif [ ${{ matrix.platform }} == 'ubuntu-latest' ]; then
            sudo apt-get install libopenblas-dev
          fi
      - 
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - 
        name: build
        run: cargo build -r -v --workspace --features full
      - 
        name: test
        run: |
          if [ ${{ matrix.platform }} == 'macos-latest' ]; then
            brew install openblas
          elif [ ${{ matrix.platform }} == 'ubuntu-latest' ]; then
            cargo test -r -v --workspace --features full,openblas
          fi
      - 
        name: bench
        if: matrix.toolchain == 'nightly'
        run: cargo bench -v --workspace --features full
      - 
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-
            ${{ runner.os }}-cargo-
