[workspace]
default-members = [ "smplx" ]

exclude = [  ]

members = [ "smplx" ]

resolver = "3"

[workspace.dependencies]
anyhow = "1"
lazy_static = "1"
paste = "1"
thiserror = { default-features = false, version = "2" }

[workspace.package]
authors = [
    "Joe McCain III <jo3mccain@icloud.com>",
]
categories = [  ]
description = "smplx is a topologically oriented crate focused on developing out a framework for working with simplicial objects in Rust."
edition = "2024"
homepage = "https://github.com/FL03/smplx/wiki"
keywords = [  ]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/smplx.git"
version = "0.0.1"

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = 'abort'
rpath = false
